<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lemma downloads</title><style>body{max-width:960px;margin:50px auto;padding:0 24px;background:#f6f7f2;color:#283d32;font:14px/1.5 system-ui}h1{font:32px Georgia,serif}form{display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;padding:8px 12px;border:1px solid #dce4d5;border-radius:5px;background:white;color:inherit}input{flex:1}table{width:100%;border-collapse:collapse;margin-top:24px}th,td{text-align:left;border-bottom:1px solid #dce4d5;padding:10px 6px}th{font-weight:500}#summary{font-size:20px}small{color:#66775c}@media(max-width:600px){th,td{font-size:11px;padding:7px 3px}}</style></head><body><a href="/">∴ lemma</a><h1>Downloads</h1><form id="access"><input id="token" type="password" aria-label="Dashboard access token" placeholder="Access token" autocomplete="off" required><select id="days" aria-label="Time range"><option value="7">7 days</option><option value="30" selected>30 days</option><option value="90">90 days</option></select><button>View</button></form><p id="status" role="status"></p><p id="summary"></p><small>Button clicks and file requests. These are not unique people or completed installations. Tokens stay in memory and are never saved in browser storage.</small><table hidden><thead><tr><th>Day</th><th>Version</th><th>Platform</th><th>Source</th><th>Clicks</th><th>Requests</th></tr></thead><tbody id="rows"></tbody></table><script type="module" src="/stats.js"></script></body></html>
