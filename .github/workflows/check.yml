name: Checks
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, macOS, ARM64, lemma-release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm install --global npm@11.8.0
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run site:build
        env:
          VITE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      - run: npm audit --audit-level=high
